name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# API and UI tests share one user account (one balance), so they run sequentially in one job.
concurrency:
  group: betting-qa-account
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BETTING_USER_ID: ${{ secrets.BETTING_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: API tests
        run: pytest -m api --junitxml=artifacts/junit-api.xml

      - name: UI tests (headless Chrome, preinstalled on the runner)
        if: always()
        run: pytest -m ui --junitxml=artifacts/junit-ui.xml

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: artifacts/
